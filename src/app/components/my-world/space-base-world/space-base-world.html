<div class="space-scene" [ngClass]="
        mode === 'aside'
            ? 'space-scene--aside'
            : 'space-scene--full'
    ">

    <!-- ========================================= -->
    <!-- FONDO ESPACIAL -->
    <!-- ========================================= -->

    <div class="space-background"></div>


    <div class="space-background"></div>

    <div class="space-planets">

        <div class="space-planet space-planet--near" [style.--planet-angle]="planetRotation + 'deg'">
        </div>

        <div class="space-planet space-planet--mid" [style.--planet-angle]="(planetRotation * 0.65 + 80) + 'deg'">
        </div>

        <div class="space-planet space-planet--far-1" [style.--planet-angle]="(planetRotation * 0.35 + 170) + 'deg'">
        </div>

        <div class="space-planet space-planet--far-2" [style.--planet-angle]="(planetRotation * 0.22 + 250) + 'deg'">
        </div>

    </div>


    <!-- ========================================= -->
    <!-- ELEMENTOS DEL MUNDO -->
    <!-- ========================================= -->

    @for (element of elements; track element.id) {

    @if (shouldRenderElement(element)) {

    <div class="space-element" [ngClass]="[
        'space-element--' + element.id,
        'stage-' + (element.stageId || 'default'),
        'variant-' + (element.variant || 'default'),
        'animation-' + (element.animation || 'none'),
        element.id === 'space-ufo' && ufoFlying
        ? 'space-ufo--flying'
        : '',
        element.id === 'space-rocket' && rocketLaunching
            ? 'space-rocket--launching'
            : ''
    ]" [style.left.%]="getElementX(element)" [style.top.%]="getElementY(element)"
        [style.width.%]="getElementWidth(element)" [style.height.%]="getElementHeight(element)"
        [style.scale]="getElementScale(element)" [style.z-index]="getElementZIndex(element)"
        (click)="onElementClick(element, $event)">

        @if (getElementImage(element)) {

        <img [src]="getElementImage(element)" class="space-element__image" alt="" draggable="false">

        }

    </div>

    }

    }

</div>
