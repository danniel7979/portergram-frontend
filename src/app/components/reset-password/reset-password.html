<div class="reset-page">

  <div class="reset-box">

    <h1>Portergram</h1>
    <p>Nueva contraseña</p>

    <div *ngIf="status === 'success'" class="success">
      Contraseña actualizada correctamente
    </div>

    <div *ngIf="status === 'error'" class="error">
      Las contraseñas no coinciden o el enlace ha caducado
    </div>

    <form #resetForm="ngForm" (ngSubmit)="resetPassword()">

      <input
        type="password"
        name="password"
        [(ngModel)]="password"
        placeholder="Nueva contraseña"
        autocomplete="new-password"
        required
      >

      <input
        type="password"
        name="repeatPassword"
        [(ngModel)]="repeatPassword"
        placeholder="Repite la contraseña"
        autocomplete="new-password"
        required
      >

      <button type="submit" [disabled]="!resetForm.form.valid">
        Cambiar contraseña
      </button>

    </form>

  </div>

</div>
